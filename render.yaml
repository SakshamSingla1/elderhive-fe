services:
  - type: web
    name: elderhive-fe
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # A client-side-routed SPA (react-router) - any path Render doesn't find a literal
    # static file for must still serve index.html so react-router can take over, rather
    # than Render returning its own 404 for a deep link like /family/bookings/42.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The deployed elderhive-be service's own public URL, e.g.
      # https://elderhive-be.onrender.com - baked into the build at build time (Vite env
      # vars aren't runtime-configurable), so this must be set before the build, not after.
      - key: VITE_API_BASE_URL
        sync: false
      # Stripe's publishable key (safe to expose client-side) - blank -> the Pay Now
      # checkout flow is simply never offered (Prompt 97's payments are additive), every
      # other page works fully without this.
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false
